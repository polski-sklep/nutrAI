services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrai}
      POSTGRES_DB: nutrai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrai"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Bound to the loopback interface only. The bot container reaches this over
    # the compose network and does not need the mapping; `scripts/load_usda.py`,
    # `scripts/bootstrap.py` and `python -m nutrai.bot` all run on the host and
    # do. A Postgres on 0.0.0.0:5432 with your food log in it is an unnecessary
    # thing to own — hence 127.0.0.1 rather than a bare "5432:5432".
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    environment:
      DATABASE_URL: postgresql://nutrai:${POSTGRES_PASSWORD:-nutrai}@db:5432/nutrai
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS}
      NUTRAI_HTTP_TOKEN: ${NUTRAI_HTTP_TOKEN:-}
      NUTRAI_HTTP_BIND: 0.0.0.0
      NUTRAI_HTTP_PORT: ${NUTRAI_HTTP_PORT:-8081}
      DEFAULT_TZ: ${DEFAULT_TZ:-Europe/Warsaw}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photos:/var/lib/nutrai/photos
    restart: unless-stopped
    networks:
      default:
      # The activity endpoint's only route in. Container-to-container on a
      # shared network, so nothing has to be published to the host at all:
      # the fitness bot reaches http://nutrai:8081 and nobody else can reach
      # it, which is a stronger statement than a token on an open port.
      nutrai-net:
        aliases: [nutrai]
    # Publishing is opt-in now. It was "${NUTRAI_HTTP_BIND:-127.0.0.1}:...",
    # and NUTRAI_HTTP_BIND is set to 0.0.0.0 in .env for the container's own
    # bind — which quietly published port 8081 on every host interface. The
    # two settings are not the same knob and sharing a variable made them
    # look like one.
    ports:
      - "${NUTRAI_HTTP_PUBLISH:-127.0.0.1}:${NUTRAI_HTTP_PORT:-8081}:8081"

networks:
  default:
  nutrai-net:
    external: true

volumes:
  pgdata:
  photos:
