  expect: {fdc_id: 2705956, outcome: warn_and_require_confirm}
  discriminators:
    - {nutrient: null, reason: "parse.validate already warns above 1,500 g. The case pins it, and pins that a warning does not silently become a refusal"}

- id: implausible_zero_mass
  stage: select
  tier: model_free
  input: "0 g of rice"
  parse: {label: rice, search_terms: "rice, white, cooked", grams: 0, grams_source: stated, state: cooked}
  expect: {fdc_id: null, outcome: item_dropped_silently_is_correct}
  discriminators:
    - {nutrient: null, reason: "resolve_items skips grams <= 0. Pinned so a future change does not turn a zero into a resolved row with a default mass"}

- id: contradictory_state
  stage: validate
  tier: needs_model
  input: "200 g of raw cooked rice"
  parse: null
  expect: {fdc_id: null, outcome: ask_which_state}
  discriminators:
    - {nutrient: null, reason: "state decides a 2.8x energy difference for rice. The only correct response to a contradiction is a question; picking either reading silently is a coin flip on the largest error in the system"}

