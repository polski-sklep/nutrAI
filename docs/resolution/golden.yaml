    - {nutrient: null, reason: "'and' matched 'Seven and Seven', a whisky cocktail, at 100 g inside a cappuccino. is_non_food must keep catching it; the regression is one line and the failure is invisible"}

- id: inverting_meatless
  stage: select
  tier: model_free
  input: "400 g breaded fried chicken breast"
  parse: {label: "chicken breast", search_terms: "chicken breast, breaded, fried, panko crust", grams: 400, grams_source: stated, state: cooked}
  expect: {fdc_id: 170718, acceptable: [170756, 2706089], forbidden: [167719, 2707469], state: cooked, grams: 400, basis: per_100g_x_grams_x_yield}
  discriminators:
    - {nutrient: 1079, per_100g: 0.5, tol: {abs: 2.5}, reason: "the meatless analogue carries 4.3 g fibre per 100 g — 17 g on a 400 g plate of fried chicken, which is the ONLY visible trace the real failure left"}
    - {nutrient: 1253, per_100g: null, tol: {pct: 40}, reason: "a soy analogue has zero cholesterol; real fried chicken has 60-90 mg. Read from the row"}
    - {nutrient: 1008, per_100g: null, tol: {pct: 25}, reason: "recorded as insufficient on purpose: 234 vs ~290 kcal passes the Atwater check, which is why this failure survived"}
  assert_also: {inverts_meaning_blocks_automatch: true}

- id: inverting_vegan_requested
  stage: select
  tier: model_free
  input: "150 g vegan chicken nuggets"
  parse: {label: "vegan chicken nuggets", search_terms: "chicken, meatless, breaded, fried", grams: 150, grams_source: stated, state: cooked}
  expect: {fdc_id: 167719, acceptable: [2707469], forbidden: [2706096, 170718], state: cooked, grams: 150, basis: per_100g_x_grams_x_yield}
  discriminators:
    - {nutrient: 1079, per_100g: 4.3, tol: {pct: 25}, reason: "the inverse of inverting_meatless: when the analogue is what was asked for, the analogue must win. Fibre is the same separator pointing the other way"}
    - {nutrient: 1253, per_100g: 0, tol: {max: 5}, reason: "real nuggets carry 36 mg. Zero cholesterol confirms the analogue"}
  pair_with: inverting_meatless
  reason: "a guard that blocks analogues wholesale would pass inverting_meatless and fail this. Neither case is a test on its own"

- id: duplicate_fdc_in_entry
