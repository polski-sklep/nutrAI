# Golden evaluation set for food-to-nutrient resolution.
#
# DATA, NOT CODE. Nothing here imports; the runner in tests/ reads it.
#
# Every `fdc_id` below was verified present and not retired against the live
# database on 25 Aug 2026 (13,636 foods: Foundation 411, SR Legacy 7,793,
# FNDDS 5,432, user_product 14; USDA Branded NOT loaded). Re-verify with the
# runner's `--verify-ids` pass before trusting a failure.
#
# --------------------------------------------------------------- field guide
#
# id            stable slug; never renumber, tests and the report cite it
# stage         which link in the chain this case exercises. One of:
#                 parse      model turns text/photo into items      (model)
#                 candidates db.search_foods / parse._candidates     (SQL)
#                 select     auto-match vs model tier decision       (SQL)
#                 mass       _mass_for / count_from_text / portions  (SQL)
#                 yield      yield_factor                            (mixed)
#                 nutrient   profiles_for / canonical fold / energy  (SQL)
#                 validate   parse.validate warnings                 (SQL)
#                 entry      whole-entry checks (dup fdc_id, sums)   (SQL)
#               A case names the FIRST stage that must be right. The runner
#               reports the stage, not just the number.
# tier          model_free | needs_model — whether a live API call is required
#               to reach the assertion when `parse` is supplied frozen
# parse         the frozen parse item. Supplying it is what makes most cases
#               model-free: it is the model's contribution, recorded once.
# expect        fdc_id       the single right answer
#               acceptable   other rows that are defensibly the same food
#               forbidden    rows that must never win; each is a real failure
#               state / grams / basis / yield_factor
# discriminators  the nutrients that separate a right match from a plausible
#               wrong one. `per_100g` is of the EXPECTED row. Each carries a
#               tolerance and the reason for that tolerance.
# traces        FAILURES.md case number, where this reproduces a traced bug
# baseline      what today's resolver actually does (measured, see SPEC-8)
#
# Tolerance vocabulary:
#   pct: n        relative, +/- n% of the expected value
#   abs: n        absolute, in the nutrient's own unit
#   max: n        assertion is an upper bound (used for "must be ~zero")
#   exact: true   no tolerance; a different number is a different food
# A case may set both pct and abs; the wider wins (protects small numbers).

meta:
  version: 1
  verified_against:
    date: 2026-08-25
    food_rows: 13636
    datasets: [foundation_food, sr_legacy_food, survey_fndds_food, user_product]
    branded_loaded: false
    auto_match_similarity: 0.62
    weak_match_similarity: 0.45
  eval_user:
    # The suite MUST NOT run as user 2. He has 132 aliases; an alias hit
    # short-circuits resolution entirely, so a case whose label matches one
    # measures the cache, not the resolver. The runner bootstraps a throwaway
    # user with zero aliases, and copies nothing but visibility of the
    # user_product rows the `own_product` cases need.
    aliases: none
    note: alias-hit behaviour is tested explicitly by the `alias_*` cases only

cases:

# =========================================================== A. one obvious row
- id: whole_banana
  stage: candidates
  tier: model_free
  input: "120 g banana"
  parse: {label: banana, search_terms: "banana, raw", grams: 120, grams_source: stated, state: raw}
  expect:
    fdc_id: 2709224            # Banana, raw (FNDDS)
    acceptable: [173944]       # Bananas, raw (SR Legacy)
    forbidden: [169394, 2709802]   # Pepper, banana, raw — a different plant
    state: raw
    grams: 120
    basis: per_100g_x_grams_x_yield
    yield_factor: 1.0
  discriminators:
    - {nutrient: 1008, per_100g: 97, tol: {pct: 12}, reason: "SR Legacy 89 vs FNDDS 97; either is right, 12% spans both"}
    - {nutrient: 1092, per_100g: 326, tol: {pct: 15}, reason: "potassium is why anyone logs a banana; a banana pepper has 256 and would pass an energy check"}
    - {nutrient: 1005, per_100g: 22.7, tol: {pct: 10}, reason: "banana pepper is 4.6 g carb — 5x apart, the cheapest separator"}
  traces: null

- id: whole_garlic_tie
  stage: candidates
  tier: model_free
  input: "6 g garlic"
  parse: {label: garlic, search_terms: "garlic, raw", grams: 6, grams_source: stated, state: raw}
  expect:
    fdc_id: 1104647            # Garlic, raw (Foundation) — precedence 0/1 wins the 3-way 1.000 tie
    acceptable: [169230, 2709786]
    forbidden: []
    state: raw
    grams: 6
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1005, per_100g: 28.2, tol: {pct: 10}, reason: "all three rows agree; this case is about determinism, not accuracy"}
  assert_also:
    deterministic_tiebreak: true
    reason: "three rows score similarity 1.000. Which one wins must not depend on planner row order — it decides the snapshot"

- id: whole_olive_oil
  stage: candidates
  tier: model_free
  input: "15 g olive oil"
  parse: {label: "olive oil", search_terms: "olive oil", grams: 15, grams_source: stated, state: as_sold}
  expect:
    fdc_id: 2710186            # Olive oil (FNDDS), 900 kcal, 100 g fat
    acceptable: [171413]       # Oil, olive, salad or cooking (SR Legacy), 884 kcal
    forbidden: [748608, 1750351]   # Foundation olive rows: NO 1008, NO 1004, satfat only
    state: as_sold
    grams: 15
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1008, per_100g: 900, tol: {pct: 3}, reason: "the whole point: 15 g of oil is 135 kcal and the forbidden row makes it 0"}
    - {nutrient: 1004, per_100g: 100, tol: {pct: 3}, reason: "748608 reports 93.7 under 1085 (NLEA fat), which nothing maps to 1004"}
    - {nutrient: 1258, per_100g: 15.5, tol: {pct: 20}, reason: "the forbidden row DOES carry satfat — so the meal gains saturated fat and loses all its energy, which is the worst possible shape of wrong"}
  traces: 2

# ================================================ B. many near-identical rows
- id: near_chicken_breast_cooked
  stage: select
  tier: model_free
  input: "250 g chicken breast, roasted, skinless"
  parse: {label: "chicken breast", search_terms: "chicken breast, skinless, roasted", grams: 250, grams_source: scale, state: cooked}
  expect:
    fdc_id: 2705956            # Chicken breast, baked/broiled/roasted, skin not eaten, from raw
    acceptable: [171140, 171534]
    forbidden: [2646170, 2727569, 174608]  # raw rows and a deli roll
    state: cooked
    grams: 250
    basis: per_100g_x_grams_x_yield
    yield_factor: 1.0
  discriminators:
    - {nutrient: 1003, per_100g: 30.2, tol: {pct: 8}, reason: "raw is 22.5 — a 250 g breast is 75 g protein or 56 g. This is his largest protein source and the error is silent"}
    - {nutrient: 1008, per_100g: 161, tol: {pct: 10}, reason: "raw row has no 1008 at all; normalise_energy fills 112 from Atwater, so the day understates by 122 kcal and nothing warns"}
    - {nutrient: 1093, per_100g: 360, tol: {pct: 40}, reason: "wide because roasting salt varies; still 2.5x off the deli roll's 883 mg, which is the trap for a misspelt query"}
  traces: null

- id: near_chicken_thigh_cooked
  stage: yield
  tier: model_free
  input: "180 g chicken thigh, boneless skinless, cooked"
  parse: {label: "chicken thigh", search_terms: "chicken thigh, boneless, skinless, cooked", grams: 180, grams_source: scale, state: cooked}
  expect:
    fdc_id: 2646171            # Chicken, thigh, boneless, skinless, RAW — the only close row
    acceptable: []
    forbidden: []
    state: cooked
    grams: 180
    basis: per_100g_x_grams_x_yield
    yield_factor: 1.33
  discriminators:
    - {nutrient: 1003, per_100g: 18.6, tol: {pct: 8}, reason: "the row is right and the yield factor is the whole answer: 180 g cooked came from ~239 g raw"}
  assert_also:
    yield_factor_not_one: true
    reason: "the auto-match path calls _accept with the default yield_factor=1.0. Only the model tier ever sets one. A cooked mass on a raw row at yf 1.0 understates protein by 25% and raises nothing"

- id: near_milk_whole
  stage: candidates
  tier: model_free
  input: "200 ml whole milk"
  parse: {label: "whole milk", search_terms: "milk, whole, 3.25% milkfat", grams: 206, grams_source: stated, state: as_sold}
  expect:
    fdc_id: 2705385            # Milk, whole (FNDDS)
    acceptable: [171265, 322892, 746782]
    forbidden: [2705388, 2705467]   # skim; chocolate milk
    state: as_sold
    grams: 206
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1004, per_100g: 3.2, tol: {pct: 15}, reason: "skim is 0.2 — the one number that separates them, and energy differs only 61 vs 34"}
    - {nutrient: 1087, per_100g: 123, tol: {pct: 15}, reason: "calcium is the reason milk is in the diary at all and is nearly identical across fat levels, so it must NOT move when the fat does"}
  assert_also:
    ml_to_g: {ml: 200, expect_g: 206, tol: {pct: 5}}
    reason: "milk is 1.03 g/ml. Nothing in the codebase converts volume to mass; the model does it silently and no test has ever checked it"

# ================================================== C. raw vs cooked, dry vs prepared
- id: rice_cooked
  stage: candidates
  tier: model_free
  input: "250 g cooked white rice"
  parse: {label: "white rice", search_terms: "rice, white, long-grain, regular, cooked", grams: 250, grams_source: scale, state: cooked}
  expect:
    fdc_id: 168878             # Rice, white, long-grain, regular, enriched, cooked
    acceptable: [169757]
    forbidden: [168877, 169756, 169753]   # raw rows; and the with-salt cooked row
    state: cooked
    grams: 250
    basis: per_100g_x_grams_x_yield
    yield_factor: 1.0
  discriminators:
    - {nutrient: 1008, per_100g: 130, tol: {pct: 8}, reason: "the raw row is 365 — 2.8x. This is the failure db.search_foods' docstring was written about; it must stay fixed"}
    - {nutrient: 1093, per_100g: 1, tol: {abs: 25}, reason: "the with-salt variant is 382 mg. 250 g of rice would add 955 mg of sodium never eaten — over a third of a day's ceiling, from rice"}
  traces: null

- id: rice_dry
  stage: yield
  tier: model_free
  input: "100 g dry white rice"
  parse: {label: "white rice", search_terms: "rice, white, long-grain, regular, raw", grams: 100, grams_source: scale, state: dry}
  expect:
    fdc_id: 168877             # Rice, white, long-grain, regular, raw, enriched
    acceptable: [169756]
    forbidden: [168878]
    state: dry
    grams: 100
    basis: per_100g_x_grams_x_yield
    yield_factor: 1.0
  discriminators:
    - {nutrient: 1008, per_100g: 365, tol: {pct: 5}, reason: "same food, opposite direction from rice_cooked. A resolver that passes one by preferring 'cooked' rows must not pass it by ignoring state"}
  pair_with: rice_cooked
  reason: "the pair is the test. Either case alone can be passed by a constant preference"

- id: pasta_dry_no_plain_row
  stage: candidates
  tier: model_free
  input: "100 g dry spaghetti"
  parse: {label: spaghetti, search_terms: "spaghetti, dry", grams: 100, grams_source: scale, state: dry}
  expect:
    fdc_id: 169736             # Pasta, dry, enriched
    acceptable: [168927, 172025]
    forbidden: [168911, 168912]   # Spaghetti, spinach — the only rows with "spaghetti" in the name
    state: dry
    grams: 100
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1079, per_100g: 3.2, tol: {pct: 25}, reason: "spinach spaghetti is 10.6 g — 3.3x. THE discriminator: energy 371 vs 372 and protein 13.0 vs 13.3 are indistinguishable, so no energy cross-check can ever see this"}
    - {nutrient: 1106, per_100g: 0, tol: {max: 3}, reason: "spinach pasta carries 23 ug RAE; a vitamin A that appears from plain pasta is the giveaway"}
    - {nutrient: 1093, per_100g: 6, tol: {abs: 15}, reason: "36 vs 6 mg — small in absolute terms, but the sign of the error is consistent with the fibre one and confirms the row rather than the query"}
  note: "there is no row named 'Spaghetti, dry' in this database. The right answer is the generic pasta row, and the near-miss outscores it 0.700 to 0.000 on the word 'spaghetti'"

- id: pasta_cooked
  stage: candidates
  tier: model_free
  input: "240 g cooked pasta"
  parse: {label: pasta, search_terms: "pasta, cooked", grams: 240, grams_source: scale, state: cooked}
  expect:
    fdc_id: 2708357            # Pasta, cooked (FNDDS)
    acceptable: [169751]
    forbidden: [168912, 168900]
    state: cooked
    grams: 240
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1005, per_100g: 30.7, tol: {pct: 10}, reason: "dry pasta is 74.7 — the state error is a 2.4x carbohydrate error"}
    - {nutrient: 1063, per_100g: 0.56, tol: {abs: 1.0}, reason: "FNDDS files sugar under 1063, not 2000. Included to keep the canonical fold under test on an ordinary food, not only on the case that revealed it"}
  traces: 4

- id: beef_mince_raw
  stage: candidates
  tier: model_free
  input: "250 g raw minced beef 20% fat"
  parse: {label: "minced beef", search_terms: "beef, ground, 80% lean meat / 20% fat, raw", grams: 250, grams_source: scale, state: raw}
  expect:
    fdc_id: 174036
    acceptable: [2514744]
    forbidden: [174037, 173111, 171790, 173110]  # other fat percentages
    state: raw
    grams: 250
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1004, per_100g: 20.0, tol: {pct: 15}, reason: "fat percentage IS the identity of a mince row; 5% vs 20% is 150 kcal on a 250 g portion"}
    - {nutrient: 1003, per_100g: 17.2, tol: {pct: 12}, reason: "protein moves the other way as fat falls, so the two together pin the row where either alone would not"}

# ============================================ D. drained / undrained, salt
- id: tuna_water_drained
  stage: select
  tier: model_free
  input: "1 tin of tuna in water, drained, 112 g"
  parse: {label: tuna, search_terms: "tuna, canned in water, drained", grams: 112, grams_source: package, state: as_sold, count: 1}
  expect:
    fdc_id: 175158             # Fish, tuna, white, canned in water, drained solids
    acceptable: [334194, 173709]
    forbidden: [171986, 171988, 175157]  # "without salt" variants; canned in OIL
    state: as_sold
    grams: 112
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 377, tol: {pct: 25}, reason: "the without-salt row is 50 mg. On 112 g that is 422 mg vs 56 mg — the entire difference between a tin that fits the sodium ceiling and one that does not"}
    - {nutrient: 1004, per_100g: 3.0, tol: {pct: 40}, reason: "canned in oil is 8.1 g; wide tolerance because white/light differ, but oil/water is still outside it"}

- id: chickpeas_canned_drained
  stage: select
  tier: needs_model
  input: "150 g chickpeas from a tin, drained"
  parse: {label: chickpeas, search_terms: "chickpeas, canned, drained", grams: 150, grams_source: stated, state: as_sold}
  expect:
    fdc_id: 173800             # canned, drained solids
    acceptable: [2707418]
    forbidden: [173801, 2644288, 2707414]   # drained AND rinsed; sodium added and rinsed; 'Chickpeas, NFS'
    state: as_sold
    grams: 150
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 246, tol: {pct: 20}, reason: "rinsing is the only thing separating these rows and it is worth ~45 mg/100 g; nothing else about the food changes"}
    - {nutrient: 1004, per_100g: 2.8, tol: {pct: 35}, reason: "today's resolver returns `Chickpeas, NFS` (2707414) at 8.9 g fat — an NFS row silently includes added cooking fat. 3.2x, and energy follows it (211 vs 139), so this one IS visible on calories; the sodium case above is not"}
    - {nutrient: 1079, per_100g: 6.4, tol: {pct: 20}, reason: "guards against the resolver drifting to a dried or cooked-from-dry row, where fibre and everything else moves together"}
  note: "no candidate reaches 0.62 — this case is a model-tier case by construction and exists to test that the model tier is given the right five candidates"

- id: peanuts_salted
  stage: select
  tier: model_free
  input: "40 g salted dry roasted peanuts"
  parse: {label: peanuts, search_terms: "peanuts, dry-roasted, with salt", grams: 40, grams_source: stated, state: as_sold}
  expect:
    fdc_id: 174262
    acceptable: [2707517]
    forbidden: [173806, 170585]
    state: as_sold
    grams: 40
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 410, tol: {pct: 25}, reason: "6 mg unsalted vs 410 mg salted — 68x, and every other nutrient in the two rows is byte-identical. There is no other way to tell them apart"}

- id: peanuts_unsalted
  stage: select
  tier: model_free
  input: "40 g unsalted dry roasted peanuts"
  parse: {label: peanuts, search_terms: "peanuts, dry roasted, without salt", grams: 40, grams_source: stated, state: as_sold}
  expect:
    fdc_id: 173806
    acceptable: []
    forbidden: [174262, 2707517]
    state: as_sold
    grams: 40
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 6, tol: {abs: 20}, reason: "absolute, not relative: 6 mg cannot carry a percentage. Anything above 26 mg means the salted row won"}
  pair_with: peanuts_salted

- id: butter_unsalted
  stage: select
  tier: model_free
  input: "10 g unsalted butter"
  parse: {label: "unsalted butter", search_terms: "butter, without salt", grams: 10, grams_source: scale, state: as_sold}
  expect:
    fdc_id: 173430             # Butter, without salt
    acceptable: []
    forbidden: [173410, 323793]
    state: as_sold
    grams: 10
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 11, tol: {abs: 30}, reason: "salted butter is 643 mg. Energy (717), fat (81.1) and cholesterol (215) are IDENTICAL in the two rows — sodium is the only observable, so this case is worthless measured on calories"}
    - {nutrient: 1008, per_100g: 717, tol: {pct: 3}, reason: "kept only to prove the case did not pass by resolving to an energy-less Foundation butter row, which was the original bug"}
  traces: 2

- id: butter_salted
  stage: select
  tier: model_free
  input: "10 g butter"
  parse: {label: butter, search_terms: "butter, salted", grams: 10, grams_source: scale, state: as_sold}
  expect:
    fdc_id: 173410
    acceptable: []
    forbidden: []
    state: as_sold
    grams: 10
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1008, per_100g: 717, tol: {pct: 3}, reason: "the regression for FAILURES 2 proper: an energy-less Foundation butter row must never be reachable"}
    - {nutrient: 1093, per_100g: 643, tol: {pct: 25}, reason: "confirms it landed on salted rather than passing by accident on without-salt, whose energy is the same"}
  pair_with: butter_unsalted
  traces: 2

- id: broccoli_boiled_nosalt
  stage: select
  tier: model_free
  input: "150 g boiled broccoli"
  parse: {label: broccoli, search_terms: "broccoli, cooked, boiled, drained", grams: 150, grams_source: stated, state: cooked}
  expect:
    fdc_id: 169967             # without salt
    acceptable: []
    forbidden: [168510]        # with salt
    state: cooked
    grams: 150
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1093, per_100g: 41, tol: {abs: 40}, reason: "262 vs 41 mg and every other value in the two rows is identical to the decimal. Home cooking without added salt is the default reading of an unqualified 'boiled broccoli'"}
    - {nutrient: 1162, per_100g: 64.9, tol: {pct: 15}, reason: "vitamin C is why broccoli is logged and is destroyed by cooking — it also catches a drift to the raw row, which is 89.2"}
  note: "an unqualified query should not silently pick the salted row. If the project decides 'with salt' is the better default, this case must be edited deliberately, not quietly"

# ============================== E. form: whole/white/yolk, skin, bone
- id: egg_white_fried
  stage: candidates
  tier: model_free
  input: "99 g egg whites, fried"
  parse: {label: "egg whites", search_terms: "egg white, cooked, fried", grams: 99, grams_source: scale, state: cooked}
  expect:
    fdc_id: 2707171            # Egg, white, cooked, fat added
    acceptable: [2707285, 2707289, 2707169]
    forbidden: [173423, 171287, 2707152, 323793, 172204]  # whole egg cooked/raw; dried egg white
    state: cooked
    grams: 99
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1253, per_100g: 0, tol: {max: 15}, reason: "THE case. Egg white has no cholesterol. Whole fried egg is 401 mg/100 g; 99 g carried 397 mg never eaten and the day read 249% of its ceiling"}
    - {nutrient: 1008, per_100g: 100, tol: {pct: 25}, reason: "wide because frying oil is a real variable (52 kcal with no added fat, 100 with). Still excludes whole fried egg at 196 and dried egg white at 376"}
    - {nutrient: 1093, per_100g: 200, tol: {pct: 90}, reason: "very wide: added salt is genuinely unknown across these rows. Present only to exclude dried egg white at 1,250 mg, which no energy or cholesterol figure would"}
  traces: 1
  note: |
    Reproduces TODAY at the resolver, measured 25 Aug 2026. Pooled candidates for
    label "egg whites" + search_terms "egg white, cooked, fried" are headed by
    `Egg, whole, cooked, fried` (173423) at 0.692 — above AUTO_MATCH — with the
    correct `Egg, white, cooked, fat added` (2707171) second at 0.600, below it.
    The production fix was a hand-corrected ALIAS for one exact phrase. The cause
    is untouched: any new phrasing re-creates the bug and caches it again.

- id: egg_white_raw
  stage: candidates
  tier: model_free
  input: "2 egg whites"
  parse: {label: "egg whites", search_terms: "egg white, raw", grams: 66, grams_source: estimate, state: raw, count: 2}
  expect:
    fdc_id: 2707168            # Egg, white only, raw
    acceptable: [172183]
    forbidden: [171287, 2707152, 323697, 172203]
    state: raw
    grams: 66
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1253, per_100g: 0, tol: {max: 5}, reason: "same separator as egg_white_fried, on the unambiguous raw row, so a failure distinguishes 'cannot read the word white' from 'cannot read the word fried'"}
    - {nutrient: 1004, per_100g: 0.17, tol: {abs: 1.5}, reason: "whole egg is 9.5 g fat. Absolute tolerance because 0.17 g cannot carry a percentage"}
  assert_also:
    grams_from_count: {count: 2, expect_g: 66, tol: {pct: 8}}
    reason: "USDA food_portion has 'large' = 33 g for fdc 172183. The database knows this exactly and nothing in the resolver reads it"
  traces: 1

- id: egg_yolk
  stage: candidates
  tier: model_free
  input: "1 egg yolk"
  parse: {label: "egg yolk", search_terms: "egg yolk, raw", grams: 17, grams_source: estimate, state: raw, count: 1}
  expect:
    fdc_id: 2707172            # Egg, yolk only, raw
    acceptable: [172184]
    forbidden: [171287, 2707152, 173436, 173422]  # whole egg; salted/sugared yolk
    state: raw
    grams: 17
    basis: per_100g_x_grams_x_yield
  discriminators:
    - {nutrient: 1253, per_100g: 1085, tol: {pct: 10}, reason: "the mirror of egg_white: a yolk carries 2.7x the cholesterol of a whole egg per gram, so 'yolk resolved to whole egg' understates where 'white resolved to whole egg' overstates"}
    - {nutrient: 1106, per_100g: 381, tol: {pct: 15}, reason: "vitamin A lives entirely in the yolk; whole egg is 160, white is 0 — one nutrient orders all three forms correctly"}
  traces: 1

- id: egg_whole_fried
  stage: candidates
  tier: model_free
  input: "1 fried egg"
  parse: {label: "fried egg", search_terms: "egg, whole, cooked, fried", grams: 46, grams_source: estimate, state: cooked, count: 1}
  expect:
    fdc_id: 173423             # Egg, whole, cooked, fried
    acceptable: []
    forbidden: [2707285, 2707289]   # the egg-WHITE fried rows
    state: cooked
    grams: 46
    basis: per_100g_x_grams_x_yield
  discriminators:
