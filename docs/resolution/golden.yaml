# ==================================== M. the alias layer, tested on purpose
- id: alias_hit_returns_cached
  stage: select
  tier: model_free
  input: "blondie"
  seed_alias: {alias: blondie, fdc_id: -289}
  expect: {fdc_id: -289, acceptable: [], forbidden: [-249], resolved_by: alias, model_calls: 0}
  discriminators:
    - {nutrient: 1008, per_100g: 509.7, tol: {pct: 2}, reason: "identity"}
  assert_also: {model_calls: 0, reason: "the alias tier is the steady state; a change that quietly stops using it multiplies cost and latency by the number of meals"}

- id: alias_to_unusable_row_is_skipped
  stage: select
  tier: model_free
  input: "butter"
  seed_alias: {alias: butter, fdc_id: 748608}
  expect: {fdc_id: 2710186, resolved_by: search, forbidden: [748608]}
  discriminators:
    - {nutrient: 1008, per_100g: null, tol: {pct: 5}, reason: "an alias is a cache of a past resolution and a past resolution can be wrong. UNUSABLE_ROW is applied on the alias path too — this case proves it still is, and extends the definition to a row with no macros at all"}
  note: "748608 (Oil, olive, extra virgin) is used as the stand-in unusable row because the butter one is gone. It has 30 nutrient rows, no energy, no 1004, and PASSES today's UNUSABLE_ROW"
  traces: 2

- id: alias_never_repointed_when_pinned
  stage: select
  tier: model_free
  input: "mince"
  seed_alias: {alias: mince, fdc_id: 174036, pinned: true}
  expect: {fdc_id: 174036, resolved_by: alias}
  assert_also:
    alias_unchanged_after_resolution: true
    reason: "upsert_alias guards pinned rows. Without it one bad parse six months from now silently redirects 'mince' and every subsequent log is wrong with no trace"
  discriminators:
    - {nutrient: 1004, per_100g: 20.0, tol: {pct: 10}, reason: "identity"}

- id: alias_not_written_on_weak_match
  stage: select
  tier: model_free
  input: "100 ml of pickle brine"
  expect: {fdc_id: null, outcome: weak_match_flagged}
  assert_also:
    no_alias_written: true
    reason: "131 unverified aliases exist because every resolution writes one. A weak or model-tier match that the user has not confirmed must not become permanent — 'a wrong match is not one wrong meal, it is every future meal containing that food'"
  discriminators:
    - {nutrient: null, reason: "behavioural"}

# ==================================== N. nutrient-layer cases
- id: sugar_canonical_fold
  stage: nutrient
  tier: model_free
  input: "one day: 240 g cooked pasta + 200 g whole milk + 100 g banana"
  components:
    - {fdc_id: 2708357, grams: 240}   # FNDDS, sugar under 1063
    - {fdc_id: 2705385, grams: 200}   # FNDDS, sugar under 1063
    - {fdc_id: 173944, grams: 100}    # SR Legacy, sugar under 2000
  expect:
    day_sugar_g: 23.2
    basis: canonical_fold_1063_into_2000
  discriminators:
    - {nutrient: 2000, per_meal: 23.2, tol: {pct: 5}, reason: "without the fold this reads 12.2 g — a correct total of the wrong half. THE case: energy, protein, fat and carbohydrate are all exactly right and only sugar is wrong"}
  assert_also:
    coverage_reported: true
  traces: 4

- id: energy_atwater_fallback
  stage: nutrient
  tier: model_free
  input: "250 g raw chicken breast"
  components:
    - {fdc_id: 2646170, grams: 250}
  expect:
    meal_kcal: 281
    basis: energy_from_2048_when_1008_absent
  discriminators:
    - {nutrient: 1008, per_meal: 281, tol: {pct: 5}, reason: "2646170 has no 1008 at all. normalise_energy fills it from 2048 (112.2/100 g). Without that the plate's largest item contributes 0 kcal and energy_cross_check cannot see it, because its own guard skips a zero"}
  assert_also:
    energy_never_summed_across_1008_2047_2048: true
    reason: "the Atwater ids are ALTERNATIVES, not addends. Folding them the way 1063/2000 is folded would treble a Foundation row"

- id: no_zero_fill_micronutrient
  stage: nutrient
  tier: model_free
  input: "150 g chickpeas (canned, drained) + 100 g olive oil row with a thin panel"
  components:
    - {fdc_id: 2644288, grams: 150}
    - {fdc_id: 2710186, grams: 15}
  expect:
    basis: missing_is_absent_not_zero
  discriminators:
    - {nutrient: 1079, coverage_max: 0.95, reason: "2644288 reports no fibre. The day's fibre must be reported with coverage below 1.0, never as a confident total that silently excluded 150 g of chickpeas"}
  assert_also:
    coverage_reported: true
    reason: "invariant 6. A phantom deficiency is a wrong number that looks like a health finding"

- id: negative_nutrient_value
  stage: nutrient
  tier: model_free
  input: "200 g raw chicken breast, meat and skin"
  components:
    - {fdc_id: 2727569, grams: 200}
  expect:
    basis: usda_value_used_verbatim
  discriminators:
    - {nutrient: 1005, per_100g: -0.43, tol: {abs: 0.01}, reason: "USDA really does publish a NEGATIVE carbohydrate for this row (carbohydrate by difference on a high-fat cut). food_nutrient is a faithful copy and must not be edited — but a day total that goes negative on a nutrient should be visible, not silently netted off another food's carbohydrate"}
  assert_also:
    negative_total_flagged: true
    reason: "there is no owner for this today. Recorded so the reconciliation decides deliberately rather than discovering it"
