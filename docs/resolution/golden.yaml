  input: "cappuccino and 300 ml milk"
  parse: {label: and, search_terms: and, grams: 100, grams_source: estimate, state: unknown}
  expect: {fdc_id: null, outcome: item_dropped_silently_is_correct, forbidden_any_food_row: true}
